name: Déploiement GitHub Pages

# Construit le site statique (Next.js export) et le publie sur GitHub Pages
# à chaque push sur master. L'app est 100 % locale (données dans le
# navigateur), il n'y a donc aucun secret ni base de données à configurer.

on:
  push:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: facturation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: facturation/package-lock.json
      - run: npm ci
      - name: Build (export statique)
        run: npm run build
        env:
          # Le site est servi sous https://<user>.github.io/facturation-llc/
          NEXT_PUBLIC_BASE_PATH: /facturation-llc
      - uses: actions/upload-pages-artifact@v3
        with:
          path: facturation/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
